workflows:
  ios-workflow:
    name: AI Chat iOS
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.example.AIChatApp"
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Create Xcode project
        script: |
          cat > project.yml <<'YML'
          name: AIChatApp
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.0"
          targets:
            AIChatApp:
              type: application
              platform: iOS
              sources:
                - path: Sources/AIChatApp
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.AIChatApp
                  INFOPLIST_KEY_CFBundleDisplayName: AI Chat
                  SWIFT_VERSION: 5.0
                  TARGETED_DEVICE_FAMILY: "1,2"
              info:
                path: Sources/AIChatApp/Info.plist
          YML
          brew install xcodegen
          xcodegen generate
      - name: Build
        script: |
          xcodebuild -project AIChatApp.xcodeproj -scheme AIChatApp -sdk iphoneos -configuration Debug -archivePath build/AIChatApp.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/AIChatApp.xcarchive
