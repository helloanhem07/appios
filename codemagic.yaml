workflows:
  ios-workflow:
    name: AI Chat iOS IPA
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.helloanhem07.AIChatApp"
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Create Xcode project
        script: |
          cat > project.yml <<'YML'
          name: AIChatApp
          options:
            bundleIdPrefix: com.helloanhem07
            deploymentTarget:
              iOS: "16.0"
          targets:
            AIChatApp:
              type: application
              platform: iOS
              sources:
                - path: Sources/AIChatApp
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.helloanhem07.AIChatApp
                  INFOPLIST_KEY_CFBundleDisplayName: AI Chat
                  SWIFT_VERSION: 5.0
                  TARGETED_DEVICE_FAMILY: "1,2"
              info:
                path: Sources/AIChatApp/Info.plist
          YML
          brew install xcodegen
          xcodegen generate
      - name: Apply signing profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcodebuild -project AIChatApp.xcodeproj \
            -scheme AIChatApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/AIChatApp.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/AIChatApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - build/ipa/*.ipa
      - build/AIChatApp.xcarchive
